<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>💐 Lời Chúc 20/10 Dành Riêng Cho Em 💖</title>
  <meta name="description" content="Một món quà nhỏ gửi tặng em nhân ngày 20/10, từ trái tim anh 💝" />
  <meta property="og:title" content="💐 Lời Chúc 20/10 Dành Riêng Cho Em 💖" />
  <meta property="og:description" content="Một món quà nhỏ gửi tặng em nhân ngày 20/10, từ trái tim anh 💝" />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="https://i.imgur.com/wzv0j7Z.jpeg" />
  <style>
    :root {
      --bg1: #ffdde1;
      --bg2: #ee9ca7;
      --accent: #ff4b6e;
      --glass: rgba(255,255,255,0.2);
      --text: #332;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      font-family: 'Poppins', 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, var(--bg1), var(--bg2));
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .card {
      position: relative;
      background: var(--glass);
      backdrop-filter: blur(16px);
      border-radius: 24px;
      padding: 40px 30px;
      text-align: center;
      color: var(--text);
      width: 90%;
      max-width: 600px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.2);
      animation: fadeIn 1.2s ease forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(40px); }
      to { opacity: 1; transform: translateY(0); }
    }

    h1 {
      font-size: 2em;
      margin: 0;
      color: #fff;
      text-shadow: 0 3px 8px rgba(0,0,0,0.25);
    }

    .lead {
      margin: 10px 0 30px;
      font-size: 1.1em;
      color: #fff;
    }

    button.btn {
      background: var(--accent);
      border: none;
      color: #fff;
      padding: 12px 28px;
      font-size: 1em;
      font-weight: 600;
      border-radius: 999px;
      cursor: pointer;
      transition: 0.3s;
      box-shadow: 0 10px 25px rgba(255,75,110,0.3);
    }
    button.btn:hover {
      transform: scale(1.05);
      box-shadow: 0 12px 28px rgba(255,75,110,0.45);
    }

    .message {
      white-space: pre-wrap;
      text-align: left;
      margin-top: 20px;
      font-size: 1.1em;
      background: rgba(255,255,255,0.85);
      border-radius: 16px;
      padding: 20px;
      box-shadow: inset 0 2px 8px rgba(0,0,0,0.1);
      color: #444;
      display: none;
      animation: slideUp 0.8s ease forwards;
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .heart {
      position: absolute;
      font-size: 200px;
      color: rgba(255,255,255,0.1);
      top: -60px;
      right: -40px;
      transform: rotate(-15deg);
      pointer-events: none;
    }

    .confetti-piece {
      position: fixed;
      width: 10px;
      height: 16px;
      opacity: 0;
      pointer-events: none;
      z-index: 9999;
    }
  </style>
</head>
<body>
  <div class="card" id="card">
    <div class="heart">❤</div>
    <h1>💐 Chúc Mừng 20/10 💐</h1>
    <p class="lead">Gửi đến em — người con gái tuyệt vời nhất trong lòng anh 💖</p>
    <button id="openBtn" class="btn">Nhận lời chúc từ anh</button>
    <div id="message" class="message"></div>
  </div>

  <template id="confettiTemplate">
    <div class="confetti-piece"></div>
  </template>

  <script>
    const message = `Em yêu à 💞\n\nChúc em ngày 20/10 thật ngọt ngào, rực rỡ và tràn đầy yêu thương.\n\nAnh cảm ơn vì em luôn ở bên, là nguồn cảm hứng và là bình yên của anh.\n\nChúc em luôn xinh đẹp, vui vẻ và hạnh phúc mỗi ngày — không chỉ hôm nay, mà mãi mãi.\n\nYêu em thật nhiều ❤️`;

    const openBtn = document.getElementById('openBtn');
    const messageBox = document.getElementById('message');

    openBtn.addEventListener('click', () => {
      messageBox.textContent = message;
      messageBox.style.display = 'block';
      launchConfetti(80);
      openBtn.style.display = 'none';
    });

    function launchConfetti(amount) {
      const template = document.getElementById('confettiTemplate');
      for (let i = 0; i < amount; i++) {
        const node = template.content.firstElementChild.cloneNode(true);
        document.body.appendChild(node);
        const el = node;
        el.style.left = Math.random() * 100 + '%';
        el.style.top = '-10%';
        el.style.background = randomColor();
        el.style.opacity = 1;
        const fall = el.animate([
          { transform: `translateY(0) rotate(${Math.random() * 360}deg)`, opacity: 1 },
          { transform: `translateY(${window.innerHeight + 200}px) rotate(${Math.random() * 1080}deg)`, opacity: 0.8 }
        ], { duration: 3000 + Math.random() * 2000, easing: 'cubic-bezier(.2,.7,.2,1)' });
        fall.onfinish = () => el.remove();
      }
    }

    function randomColor() {
      const colors = ['#ff6b81', '#ffd166', '#6bf178', '#7ac7ff', '#f78cff', '#ffb3c6', '#ffd3a5'];
      return colors[Math.floor(Math.random() * colors.length)];
    }
  </script>
</body>
</html>
